<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/praxis-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Praxis</title>
  </head>
  <body>
    <div id="root">
      <style>
        #boot-fallback {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 12px;
          background:
            radial-gradient(60vw 50vh at 70% 15%, rgba(34,211,238,0.10), transparent 60%),
            radial-gradient(55vw 45vh at 20% 85%, rgba(139,92,246,0.10), transparent 60%),
            #070b1a;
          color: #e6ebff;
          font-family: Inter, system-ui, sans-serif;
        }
        #boot-fallback .wordmark {
          font-family: "Space Grotesk", Inter, system-ui, sans-serif;
          font-size: 40px;
          font-weight: 700;
          letter-spacing: 0.04em;
        }
        #boot-fallback .tagline {
          font-size: 11px;
          letter-spacing: 0.32em;
          text-transform: uppercase;
          color: rgba(139, 146, 184, 0.8);
        }
        #boot-fallback .chip {
          margin-top: 8px;
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 6px 14px;
          border-radius: 9999px;
          border: 1px solid rgba(255,255,255,0.06);
          background: rgba(26, 35, 66, 0.5);
          font-size: 11px;
          color: #8b93b8;
        }
        #boot-fallback .chip b { color: #22d3ee; font-weight: 500; }
        #boot-fallback .dot { width:6px; height:6px; border-radius:9999px; background:#22d3ee; }
      </style>
      <div id="boot-fallback">
        <div class="wordmark">Praxis</div>
        <div class="tagline">Generative OS</div>
        <div class="chip"><span class="dot"></span>Powered by <b>Cerebras</b></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
